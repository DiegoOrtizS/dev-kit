name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - id: plan
        run: node bin/dev-kit.mjs release-tag >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.create == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "dev-kit ${TAG#v}" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" --verify-tag --generate-notes --target "$GITHUB_SHA"
      - if: steps.plan.outputs.create != 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: echo "$TAG already exists; nothing to release"
